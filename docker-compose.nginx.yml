# Betrieb hinter einem vorhandenen NGINX, das TLS übernimmt und an einen lokalen Port weiterleitet,
# z. B. dem NGINX einer Hosting-Verwaltungsoberfläche ("Proxy auf App-Server/Port"). Ohne Caddy.
# Anleitung: DEPLOY.md
#   cp .env.example .env   # Werte eintragen, COMPOSE_FILE=docker-compose.nginx.yml setzen
#   docker compose up -d --build
#
# Netze: Der Server hängt nur im internen Netz "backend" (kein Internet, keine Adresse des Hosts).
# Der Gateway hängt zusätzlich im normalen Netz: Er nimmt den Port auf 127.0.0.1 an und reicht ihn an den Server durch,
# und er lässt ausgehend nur Verbindungen zum weclapp-Mandanten zu.

name: weclapp-mcp

services:
  weclapp-mcp:
    build: .
    restart: unless-stopped
    environment:
      WECLAPP_TENANT: ${WECLAPP_TENANT:?WECLAPP_TENANT in .env setzen}
      WECLAPP_READ_ONLY: ${WECLAPP_READ_ONLY:-false}
      WECLAPP_ALLOW_PUBLIC_COMMENTS: ${WECLAPP_ALLOW_PUBLIC_COMMENTS:-false}
      WECLAPP_AUDIT_RETENTION_DAYS: ${WECLAPP_AUDIT_RETENTION_DAYS:-365}
      WECLAPP_AUDIT_MAX_MB: ${WECLAPP_AUDIT_MAX_MB:-100}
      WECLAPP_MAX_WRITES_PER_HOUR: ${WECLAPP_MAX_WRITES_PER_HOUR:-120}
      WECLAPP_TIMEZONE: ${WECLAPP_TIMEZONE:-Europe/Berlin}
      # Öffentliche Domain. Schickt das vorgeschaltete NGINX stattdessen "Host: 127.0.0.1:<port>",
      # passt das auch: localhost und 127.0.0.1 sind immer erlaubt.
      MCP_ALLOWED_HOSTS: ${MCP_DOMAIN:?MCP_DOMAIN in .env setzen}
      # Nur auf true setzen, wenn das vorgeschaltete NGINX X-Forwarded-For selbst setzt oder ergänzt
      # (DEPLOY.md, Schritt 4). Reicht es den Header des Clients unverändert durch,
      # könnte jeder seine Adresse fälschen und das Rate-Limit umgehen.
      MCP_TRUST_PROXY: ${MCP_TRUST_PROXY:-false}
      # Ausgehend nur über den Gateway. fetch nutzt den Proxy aus der Umgebung unter Node 24 nur mit NODE_USE_ENV_PROXY.
      NODE_USE_ENV_PROXY: "1"
      HTTPS_PROXY: http://gateway:3128
      NO_PROXY: localhost,127.0.0.1
    # Kein Port: Docker veröffentlicht für einen Container, der nur im internen Netz hängt, ohnehin keinen.
    # Erreichbar ist der Server allein über den Gateway.
    volumes:
      # Änderungsprotokoll (JSON Lines, eine Datei pro Monat) – regelmäßig sichern, siehe DEPLOY.md
      - audit_data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 512m
    # Auf geteilten oder verwalteten Servern den Rechner nicht übermäßig belasten
    cpus: 1.0
    # Kein /dev/shm: bliebe trotz read_only beschreibbar (64 MB), Node braucht es nicht
    ipc: none
    # Docker-Log begrenzen (der Server schreibt nur Start- und Fehlermeldungen, nie den Token)
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
    networks: [backend]

  gateway:
    # Dasselbe Image, anderes Programm: src/gateway.ts. Liest nur den Code, schreibt nichts.
    build: .
    command: ["--permission", "--allow-fs-read=/app", "dist/gateway.js"]
    restart: unless-stopped
    environment:
      # Das einzige Ziel nach draußen. TLS bleibt Ende-zu-Ende, der Gateway sieht den Token nie.
      EGRESS_ALLOW: ${WECLAPP_TENANT:?WECLAPP_TENANT in .env setzen}.weclapp.com:443
      # Eingehend: TCP unverändert an den Server (Header wie X-Forwarded-For bleiben, wie das NGINX sie schickt)
      INGRESS_TARGET: weclapp-mcp:3000
      INGRESS_PORT: "3000"
    ports:
      # Nur auf der Loopback-Schnittstelle: erreichbar allein für das NGINX auf demselben Server.
      # Die Adresse 127.0.0.1 steht hier fest und lässt sich über .env nicht ändern.
      - "127.0.0.1:${MCP_PORT:?MCP_PORT in .env setzen (der Port, an den das NGINX weiterleitet)}:3000"
    healthcheck:
      # Prüft den Weg herein bis zum Server
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 50
    mem_limit: 128m
    cpus: 0.5
    # Kein /dev/shm: bliebe trotz read_only beschreibbar (64 MB), Node braucht es nicht
    ipc: none
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
    networks: [backend, default]

networks:
  # Intern: kein Weg ins Internet. inhibit_ipv4: Die Bridge bekommt keine Adresse des Hosts,
  # Dienste auf dem Server (Datenbanken, Panel, andere Container-Ports) sind von hier aus nicht erreichbar.
  backend:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"

volumes:
  audit_data:
